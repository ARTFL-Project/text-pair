[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textpair_graph"
version = "0.1.0"
description = "Graph building and clustering for TextPair alignment data"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "ARTFL Project", email = "artfl@uchicago.edu"}
]
license = {text = "MIT"}

dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "umap-learn",
    # LocalMAP, for the 2D display projection.
    "pacmap",
    "hdbscan",
    "networkx",
    "sentence-transformers",
    "torch",
    "numba",
    "lz4",
    "orjson",
    "tqdm",
    "textpair_llm",
    "faiss-cpu",
    # For the vendored cluster labeler (textpair_graph.topic_labeler), which runs
    # a small instruction-tuned model in this environment. The floor is set by the
    # checkpoint rather than the code: google/gemma-4-E2B-it reports
    # model_type "gemma4" and is refused outright by transformers < 5.5.
    "transformers>=5.5",
    "accelerate",
]

# Term-extraction normalization is absent here on purpose: transformer spaCy
# models need spacy-transformers, which pins transformers<4.53.3, while this
# environment needs >=5.5 for sentence-transformers and the label model. The
# stage runs in the textpair environment instead, which already carries that
# ceiling -- see textpair_graph/lemmatize_worker.py.

[project.optional-dependencies]
cuda = [
    "cuml-cu12==25.10.*",
    "cugraph-cu12==25.10.*",
    "nx-cugraph-cu12==25.10.*",
]

[project.scripts]
textpair-graph = "textpair_graph.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["textpair_graph*"]

[tool.uv.sources]
textpair_llm = { path = "../textpair_llm", editable = true }
cuml-cu12 = [
    { index = "nvidia-pypi", extra = "cuda" },
]
cugraph-cu12 = [
    { index = "nvidia-pypi", extra = "cuda" },
]
nx-cugraph-cu12 = [
    { index = "nvidia-pypi", extra = "cuda" },
]

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com"
explicit = true
